# Tests and package on every push and pull request; a tag v<version> also publishes a release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: tests/run.sh

      - name: Build package
        run: ./build.sh

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(cat dist/VERSION)"

      - uses: actions/upload-artifact@v4
        with:
          name: my-ip-geo-plasma6
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.plasmoid
          --title "My IP & Geo $GITHUB_REF_NAME"
          --notes-file dist/release-notes.md
